<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magiczny Świat | Kontakt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <a class="logo" href="index.html">✦ Magiczny Świat</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="galeria.html">Galeria</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </header>

    <main class="content">
      <h1>Skontaktuj się z nami</h1>
      <p>Wyślij wiadomość przez naszą magiczną pocztę!</p>

      <form id="contact-form">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Wpisz swój e-mail"
          required
        />

        <label for="subject">Temat wiadomości</label>
        <select id="subject" name="subject" required>
          <option value="">Wybierz temat</option>
          <option value="hogwart">Hogwart</option>
          <option value="dom">Domy Hogwartu</option>
          <option value="galeria">Galeria</option>
          <option value="inne">Inne</option>
        </select>

        <label for="message">Wiadomość</label>
        <textarea
          id="message"
          name="message"
          placeholder="Napisz swoją wiadomość..."
          minlength="10"
          required
        ></textarea>

        <input class="button" type="submit" value="Wyślij" />
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer>
      <p>Projekt edukacyjny o świecie Harry’ego Pottera.</p>
      <p>© 2026 Yaraslau Tumilovich</p>
    </footer>
  </body>
</html>
